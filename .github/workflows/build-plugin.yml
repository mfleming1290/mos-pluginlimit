name: Build and Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version (for example 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Download icon
        run: wget -O icon.png "https://raw.githubusercontent.com/mfleming1290/mos-hub/main/images/plugin-source-limitIcon.png"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Vue plugin
        working-directory: page
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.VERSION }}
        run: npm install && npm run build

      - name: Create package structure
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PKG_NAME="pluginlimit-${VERSION}-1+mos-plugin"
          PKG_DIR="${PKG_NAME}_all"

          mkdir -p "${PKG_DIR}/var/www/mos-plugins/pluginlimit"
          mkdir -p "${PKG_DIR}/DEBIAN"

          cp -R page/dist/pluginlimit/* "${PKG_DIR}/var/www/mos-plugins/pluginlimit/"
          cp icon.png "${PKG_DIR}/var/www/mos-plugins/pluginlimit/"

          cat > "${PKG_DIR}/DEBIAN/control" << CONTROL
          Package: mos-pluginlimit-plugin
          Version: ${VERSION}-1+mos-plugin
          Architecture: all
          Maintainer: mfleming1290
          Description: Adjustable MOS Hub plugin source archive size limit
          CONTROL

          cat > "${PKG_DIR}/DEBIAN/postinst" << 'POSTINST'
          #!/bin/bash
          exit 0
          POSTINST
          chmod +x "${PKG_DIR}/DEBIAN/postinst"

          cat > "${PKG_DIR}/DEBIAN/postrm" << 'POSTRM'
          #!/bin/bash
          exit 0
          POSTRM
          chmod +x "${PKG_DIR}/DEBIAN/postrm"

      - name: Build .deb package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PKG_NAME="pluginlimit-${VERSION}-1+mos-plugin"
          PKG_DIR="${PKG_NAME}_all"
          DEB_FILE="${PKG_NAME}_all.deb"
          dpkg-deb --build "${PKG_DIR}"
          md5sum "${DEB_FILE}" | awk '{print $1}' > "${DEB_FILE}.md5"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: MOS Plugin Source Limit ${{ steps.version.outputs.VERSION }}
          body: |
            Adjustable MOS Hub plugin source archive size limit.
          files: |
            pluginlimit-${{ steps.version.outputs.VERSION }}-1+mos-plugin_all.deb
            pluginlimit-${{ steps.version.outputs.VERSION }}-1+mos-plugin_all.deb.md5
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
